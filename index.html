<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAFE — Seed Image Dataset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
/* Apply the stored theme before first paint — otherwise a dark-theme
   user sees a white flash while the rest of the scripts load. */
(function () {
  try {
    var m = localStorage.getItem('cafe.theme');
    if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
  } catch (e) { /* private mode: fall back to the system preference */ }
})();
</script>
</head>
<body>

<!-- ============ LOGIN SHELL ============ -->
<div id="login-root" class="login-root" hidden></div>

<!-- ============ APP SHELL ============ -->
<div id="app-root" class="app" hidden>
  <a class="skip-link" href="#view">Skip to main content</a>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark"></div>
      <span class="brand-name">CAFE</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="user-chip" id="sidebar-user" type="button">
        <span class="avatar" id="sidebar-avatar">AR</span>
        <span class="user-chip-text">
          <strong id="sidebar-name">Alex Rivera</strong>
          <small id="sidebar-role">Admin</small>
        </span>
        <span class="user-chip-caret" data-icon="chevron-down"></span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-toggle" type="button" aria-label="Toggle navigation" data-icon="menu"></button>
      <div class="topbar-title" id="topbar-title"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
        <button class="icon-btn" id="refresh-btn" type="button" aria-label="Refresh data" data-icon="refresh"></button>
        <div class="profile-wrap">
          <button class="profile-btn" id="profile-btn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar avatar-sm" id="profile-avatar">AR</span>
          </button>
          <div class="menu profile-menu" id="profile-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="sr-only" id="live-region" role="status" aria-atomic="true"></div>

<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/photos.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/label.js"></script>
<script src="js/views/dataset.js"></script>
<script src="js/views/farmers.js"></script>
<script src="js/views/seed-management.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
